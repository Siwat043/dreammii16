<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Universe 💫</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Kanit',sans-serif;}
body{
  height:100vh;
  overflow:hidden;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* ดาวพื้นหลัง */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle{
  from{opacity:0.2;}
  to{opacity:1;}
}

/* หัวใจเริ่มต้น */
.start-screen{
  position:absolute;
  text-align:center;
  z-index:5;
}
.big-heart{
  font-size:100px;
  animation: pulse 1.5s infinite;
  cursor:pointer;
}
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

/* การ์ด */
.card{
  display:none;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,100,0.5);
  animation: fadeUp 2s ease forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(50px);}
  to{opacity:1;transform:translateY(0);}
}
h1{
  color:#ff4d9d;
}
.message{
  margin-top:20px;
  font-size:18px;
  min-height:30px;
  color:#ffb3d9;
}
button{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d9d;
  color:white;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  transform:scale(1.1);
}

/* หัวใจระเบิด */
.explode-heart{
  position:absolute;
  font-size:20px;
  animation: explode 2s linear forwards;
}
@keyframes explode{
  from{transform:translate(0,0);opacity:1;}
  to{transform:translate(var(--x),var(--y));opacity:0;}
}
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
  <div class="big-heart" onclick="startExperience()">💓</div>
  <p>กดเลยโอ้นน</p>
</div>

<div class="card" id="card">
  <h1>กราบขออภัยอีกครั้งอย่างสูง🙏🙏🙏 🌌</h1>
  <button onclick="showLove()">กดอีกครั้งสิ 💞</button>
  <div class="message" id="msg"></div>
</div>

<iframe id="ytplayer" width="0" height="0" frameborder="0"
allow="autoplay; encrypted-media"></iframe>

<script>
/* สร้างดาว */
for(let i=0;i<120;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.top=Math.random()*100+"vh";
  star.style.left=Math.random()*100+"vw";
  star.style.animationDuration=(1+Math.random()*2)+"s";
  document.body.appendChild(star);
}

function startExperience(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("card").style.display="block";

  document.getElementById("ytplayer").src=
  "https://www.youtube.com/embed/m6qgxvYcjGU?autoplay=1&loop=1&playlist=m6qgxvYcjGU";

  explodeHearts();
}

function explodeHearts(){
  for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.className="explode-heart";
    heart.innerText="💖";
    heart.style.left="50%";
    heart.style.top="50%";
    heart.style.setProperty('--x',(Math.random()*400-200)+"px");
    heart.style.setProperty('--y',(Math.random()*400-200)+"px");
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
  }
}

function showLove(){
  const texts=[
    "เค้ารักเทอนะโอ้นนน ☀️",
    "ถึงจะไม่รู้จะเเสดงยังไง💫",
    "อยุ่ไกลกันอีกกก 💖",
    "เดี๋ยวก็เจอกันเเล้วรักเทอนะะะะคิดถึงมากๆๆๆๆ 🌌"
  ];
  document.getElementById("msg").innerText=
  texts[Math.floor(Math.random()*texts.length)];
}
</script>

</body>
</html>
