<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Catch 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Kanit',sans-serif;}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

h1{
  color:white;
  margin-bottom:10px;
}

#scoreBoard{
  color:white;
  margin-bottom:10px;
  font-size:18px;
}

#gameArea{
  position:relative;
  width:90vw;
  height:70vh;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  overflow:hidden;
  backdrop-filter:blur(10px);
}

.heart{
  position:absolute;
  font-size:30px;
  cursor:pointer;
  animation:fall linear forwards;
}

@keyframes fall{
  from{transform:translateY(-50px);}
  to{transform:translateY(80vh);}
}

#startBtn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
  font-size:16px;
}

#startBtn:hover{
  transform:scale(1.1);
}

#message{
  margin-top:10px;
  color:white;
  font-size:20px;
}
</style>
</head>
<body>

<h1>💘 เกมเก็บหัวใจ 💘</h1>
<div id="scoreBoard">คะแนน: 0 | เวลา: 30</div>
<div id="gameArea"></div>
<button id="startBtn" onclick="startGame()">เริ่มเกม 💖</button>
<div id="message"></div>

<iframe id="ytplayer" width="0" height="0" frameborder="0"
allow="autoplay; encrypted-media"></iframe>

<script>
let score=0;
let timeLeft=30;
let gameInterval;
let heartInterval;
let playing=false;

function startGame(){
  if(playing) return;

  score=0;
  timeLeft=30;
  playing=true;
  document.getElementById("message").innerText="";
  document.getElementById("scoreBoard").innerText="คะแนน: 0 | เวลา: 30";

  document.getElementById("ytplayer").src=
  "https://www.youtube.com/embed/m6qgxvYcjGU?autoplay=1&loop=1&playlist=m6qgxvYcjGU";

  gameInterval=setInterval(updateTime,1000);
  heartInterval=setInterval(createHeart,800);
}

function updateTime(){
  timeLeft--;
  document.getElementById("scoreBoard").innerText=
  "คะแนน: "+score+" | เวลา: "+timeLeft;

  if(timeLeft<=0){
    endGame();
  }
}

function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerText="💖";
  heart.style.left=Math.random()*85+"vw";
  heart.style.animationDuration=(3+Math.random()*2)+"s";

  heart.onclick=function(){
    score++;
    heart.remove();
    document.getElementById("scoreBoard").innerText=
    "คะแนน: "+score+" | เวลา: "+timeLeft;
  };

  document.getElementById("gameArea").appendChild(heart);

  setTimeout(()=>heart.remove(),5000);
}

function endGame(){
  clearInterval(gameInterval);
  clearInterval(heartInterval);
  playing=false;

  let finalMessage="";
  if(score<10){
    finalMessage="เก็บใหม่เลยโอ้น";
  }else if(score<25){
    finalMessage="เก่งมากเลย 💕";
  }else{
    finalMessage="เก่งมากเลยโอ้น 💖💖";
  }

  document.getElementById("message").innerText=finalMessage;
}
</script>

</body>
</html>
