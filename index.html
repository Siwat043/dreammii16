<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            position: relative;
            animation: fadeIn 2s ease;
        }
        h1 {
            color: #ff4d6d;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #555;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #e63950;
            transform: scale(1.05);
        }
        .rose {
            font-size: 60px;
            animation: float 3s ease-in-out infinite;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #ff4d6d;
            min-height: 24px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="rose">🌹</div>
        <h1>ถึงคนพิเศษของฉัน 💖</h1>
        <p>เว็บไซต์เล็ก ๆ นี้ ทำขึ้นมาเพื่อเธอคนเดียวเลยนะ</p>
        <button onclick="showLove()">กดดูความลับ 💌</button>
        <div class="message" id="loveMessage"></div>
    </div>

    <script>
        function showLove() {
            const messages = [
                "รักเธอมากกว่าดอกกุหลาบทั้งสวน 🌹",
                "อยู่ข้าง ๆ เธอเสมอนะ 💕",
                "เธอคือรอยยิ้มของฉันทุกวัน 😊",
                "ขอบคุณที่เข้ามาในชีวิตกันนะ 💖"
            ];
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('loveMessage').innerText = messages[randomIndex];
        }
    </script>
</body>
</html>
