<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Kanit',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.card{
  background:white;
  padding:40px;
  border-radius:30px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  max-width:420px;
  position:relative;
  animation:fadeIn 1.5s ease;
  z-index:2;
}
h1{color:#ff4d6d;margin-bottom:10px}
p{font-size:18px;margin-bottom:20px;color:#555}
button{
  background:#ff4d6d;
  color:white;
  border:none;
  padding:12px 25px;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
  margin:5px;
}
button:hover{background:#e63950;transform:scale(1.05)}
.rose{font-size:60px;animation:float 3s ease-in-out infinite}
.message{margin-top:15px;font-size:18px;color:#ff4d6d;min-height:24px}
.counter{margin-top:10px;color:#e63950;font-weight:600}

.heart{
  position:absolute;
  color:#ff4d6d;
  animation:fall linear infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(0.8)}
  to{opacity:1;transform:scale(1)}
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg)}
  100%{transform:translateY(110vh) rotate(360deg)}
}
</style>
</head>
<body>

<div class="card">
  <div class="rose">🌹</div>
  <h1 id="title">โอ้นนน 💖</h1>
  <p>อย่างอลกันเลยนะโอ้น<br>กราบขออภัย🙏🙏</p>
  <button onclick="showLove()">กดดูความลับ 💌</button>
  <button onclick="toggleMusic()">เปิด / ปิด เพลง 🎵</button>
  <div class="message" id="loveMessage"></div>
  <div class="counter" id="dayCounter"></div>
</div>

<button onclick="startMusic()">กดเพื่อเปิดเพลง 🎵</button>

<iframe id="ytplayer"
  width="0"
  height="0"
  src=""
  frameborder="0"
  allow="autoplay; encrypted-media">
</iframe>

<script>
function startMusic() {
  document.getElementById("ytplayer").src =
    "https://www.youtube.com/embed/m6qgxvYcjGU?autoplay=1&loop=1&playlist=m6qgxvYcjGU";
}
</script>



<script>
// ====== ปรับชื่อแฟนตรงนี้ ======
const loverName = "ดรีมมี่";
document.getElementById("title").innerText = "ถึง " + loverName + " 💖";

// ====== ข้อความสุ่ม ======
function showLove(){
  const messages=[
    "เค้ารักเทอนะโอ้นนน 🌹",
    "อย่างอลเค้าเลยนะะะ 💕",
    "คิดถึงเทอมากๆๆเบยยย 😊",
    "ดีกันโอ้นน 💖",
    "รักเทอที่สุดเบยยย 🌍",
  ];
  const randomIndex=Math.floor(Math.random()*messages.length);
  typeWriter(messages[randomIndex]);
}

// ====== พิมพ์ทีละตัว ======
function typeWriter(text){
  let i=0;
  const speed=50;
  const target=document.getElementById("loveMessage");
  target.innerHTML="";
  function typing(){
    if(i<text.length){
      target.innerHTML+=text.charAt(i);
      i++;
      setTimeout(typing,speed);
    }
  }
  typing();
}

// ====== เพลง ======
function toggleMusic(){
  const music=document.getElementById("bgMusic");
  if(music.paused){music.play();}
  else{music.pause();}
}

// ====== นับวันครบรอบ ======
const startDate=new Date("2018-06-16"); // แก้วันเริ่มคบตรงนี้
const today=new Date();
const diffTime=today-startDate;
const diffDays=Math.floor(diffTime/(1000*60*60*24));
document.getElementById("dayCounter").innerText=
  "เรารักกันมาแล้ว " + diffDays + " วัน 💞";

// ====== หัวใจตก ======
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="💗";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=Math.random()*20+15+"px";
  heart.style.animationDuration=Math.random()*3+3+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove();},6000);
}
setInterval(createHeart,300);
</script>

</body>
</html>
